name: flutter_map_cluster
description: A Dart implementation of Leaflet.makercluster for Flutter apps.
  Provides beautiful animated marker clustering functionality for flutter_map.
  A maintained fork of flutter_map_marker_cluster by Lorenzo Pongetti.
version: 0.1.0

homepage: https://github.com/kolega69/flutter_map_cluster
repository: https://github.com/kolega69/flutter_map_cluster

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_map_marker_popup: ^8.1.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
